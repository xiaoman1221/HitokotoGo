<!DOCTYPE html>
<html lang="zh-CN" class="stats-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统计 - HitokotoGo</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="top-right-link">
    <a href="/">
        <span>← 返回</span>
    </a>
</div>

<main class="container stats-container">
    <div class="header">
        <h1>统计</h1>
        <div class="subtitle">数据概览</div>
    </div>

    <div id="total-card" class="total-card" style="display:none">
        <div class="total-card-inner">
            <div class="total-card-left">
                <div>API：©2026 HitokotoGo Powered By 小满1221</div>
                <div>API：<a href="https://git.1v.fit/xiaoman1221/HitokotoGo" target="_blank" rel="noopener noreferrer" style="color:inherit;">开放源代码</a></div>
                <div>句子包：<a href="https://hitokoto.cn" target="_blank" rel="noopener noreferrer" style="color:inherit;">2016-2026 MoeTeam. All Rights Reserved.</a></div>
                <div>句子包版本: <span id="bundle-version">-</span></div>
            </div>
            <div class="total-card-right">
                <div id="total-number" class="total-number">0</div>
                <div class="total-label">句子总数</div>
            </div>
        </div>
    </div>

    <div id="status-section" class="status-section" style="display:none">
        <div class="status-grid">
            <div class="status-card">
                <div class="status-label">累计查询次数</div>
                <div class="status-value" id="total-queries">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">工作负载 (load)</div>
                <div class="status-value" id="load">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">实时请求数 (次/分)</div>
                <div class="status-value" id="rpm">-</div>
            </div>
            <div class="status-card">
                <div class="status-label">平均内存</div>
                <div class="status-value" id="memory">-</div>
            </div>
        </div>
    </div>

    <div id="category-grid" class="category-grid">
        <div class="loading">正在加载统计数据...</div>
    </div>
</main>

<script src="/js/stats.js"></script>
</body>
</html>
