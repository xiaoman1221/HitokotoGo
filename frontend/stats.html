<!DOCTYPE html>
<html lang="zh-CN" class="stats-page">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统计 - HitokotoGo</title>
    <link rel="stylesheet" href="/css/style.css?v=1.0.5" />
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="/">Hitokoto<strong>Go</strong></a>
        <nav class="nav">
            <a href="/"><span>← 返回</span></a>
        </nav>
    </header>

    <main class="stats">
        <header class="stats-hero">
            <p class="kicker mono">Stats&nbsp;//&nbsp;数据概览</p>
            <h1 class="stats-title">统计</h1>
            <p class="stats-subtitle mono">句子包 v<span id="bundle-version">-</span>&nbsp;·&nbsp;©2026 Powered By 小满1221&nbsp;·&nbsp;<a href="https://github.com/xiaoman1221/HitokotoGo" target="_blank" rel="noopener noreferrer">开放源代码 ↗</a></p>
        </header>

        <section class="stats-overview">
            <div class="panel panel-total">
                <p class="panel-label mono">句子总数 / Total</p>
                <p class="total-number" id="total-number">—</p>
                <p class="panel-note">按 12 个分类实时统计，数据来自 hitokoto.cn</p>
            </div>
            <div class="panel panel-status">
                <div class="status-row">
                    <span class="mono">累计查询</span>
                    <span class="status-value mono" id="total-queries">-</span>
                </div>
                <div class="status-row">
                    <span class="mono">实时请求 / 分</span>
                    <span class="status-value mono" id="rpm">-</span>
                </div>
                <div class="status-row">
                    <span class="mono">负载 load&nbsp;<span class="dim">1 / 5 / 15</span></span>
                    <span class="status-value mono" id="load">-</span>
                </div>
                <div class="status-row">
                    <span class="mono">内存占用</span>
                    <span class="status-value mono" id="memory">-</span>
                </div>
            </div>
        </section>

        <section class="category-section">
            <p class="kicker mono">Categories&nbsp;//&nbsp;<span id="category-count">-</span>&nbsp;个分类</p>
            <div id="category-list" class="category-list">
                <p class="loading">正在加载统计数据…</p>
            </div>
        </section>
    </main>

    <script src="/js/stats.js?v=1.0.5"></script>
</body>
</html>
