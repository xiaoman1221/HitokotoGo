name: Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, 'release')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'v\d+\.\d+(\.\d+)?' | head -1)
            if [ -z "$VERSION" ]; then
              echo "提交信息中未找到版本号 (vX.Y.Z)"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -o hitokotogo${{ matrix.goos == 'windows' && '.exe' || '' }} .
      - name: Package with frontend
        run: |
          DIR=hitokotogo-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir -p "$DIR"
          cp hitokotogo${{ matrix.goos == 'windows' && '.exe' || '' }} "$DIR/"
          cp -r frontend "$DIR/"
          cp .env.exp "$DIR/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${DIR}.zip" "$DIR/"
          else
            tar czf "${DIR}.tar.gz" "$DIR/"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: hitokotogo-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.*

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            VERSION=$(echo "${{ github.event.head_commit.message }}" | grep -oP 'v\d+\.\d+(\.\d+)?' | head -1)
            if [ -z "$VERSION" ]; then
              echo "提交信息中未找到版本号 (vX.Y.Z)"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hitokotogo:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hitokotogo:latest
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*/*
